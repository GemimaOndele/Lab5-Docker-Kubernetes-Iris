name: Lab5 - tests et publication ACR avec OIDC
on:
  push:
    branches: [main]
    paths: ['.github/workflows/acr-publish.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: |
          python train.py model/model.joblib
          python -m pytest -q
  build-push:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: cd55bd12-6a90-49b4-a72d-10beb09e825a
          tenant-id: a2697119-66c5-4126-9991-b0a8d15d367f
          subscription-id: 5d564eeb-c928-4d01-9948-76ba3fc789d0
      - name: Publier les deux versions amd64 sans ACR Tasks
        run: |
          set -euo pipefail
          mkdir -p evidence/partie2-acr
          az acr login --name acrlab5go4271
          for tag in v1 v2; do
            if [ "$tag" = v1 ]; then version=1.0.0; else version=2.0.0; fi
            image="acrlab5go4271.azurecr.io/iris-api:$tag"
            docker build --platform linux/amd64 --build-arg APP_VERSION="$version" -t "$image" .
            docker push "$image" | tee "evidence/partie2-acr/push-$tag.txt"
            docker image inspect "$image" --format '{{json .}}' > "evidence/partie2-acr/image-$tag.json"
            az acr repository show --name acrlab5go4271 --image "iris-api:$tag" -o json > "evidence/partie2-acr/manifest-$tag.json"
          done
          az acr show -n acrlab5go4271 --query '{name:name,location:location,sku:sku.name,adminUserEnabled:adminUserEnabled,loginServer:loginServer,provisioningState:provisioningState}' -o json > evidence/partie2-acr/registry.json
          az acr repository show-tags -n acrlab5go4271 --repository iris-api -o json > evidence/partie2-acr/tags.json
          az identity show -g rg-lab5-go -n id-lab5-go-github -o json > evidence/partie2-acr/identity.json
          az identity federated-credential list -g rg-lab5-go --identity-name id-lab5-go-github -o json > evidence/partie2-acr/federation.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          counts=[]
          for tag in ['naive','v1']:
              p=Path('evidence/partie1')/('trivy-'+tag+'.json')
              d=json.loads(p.read_text())
              vs=[v for r in d.get('Results',[]) for v in r.get('Vulnerabilities',[])]
              counts.append({'image':tag,'date':d.get('CreatedAt'),'occurrences':{s:sum(v['Severity']==s for v in vs) for s in ['HIGH','CRITICAL']},'distinct_cve':{s:len({v['VulnerabilityID'] for v in vs if v['Severity']==s}) for s in ['HIGH','CRITICAL']}})
          Path('evidence/partie2-acr/cve-distinctes.json').write_text(json.dumps(counts,indent=2))
          print('ACR_PUBLICATION_OIDC_OK')
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lab5-acr-preuves
          path: evidence/partie2-acr/
          retention-days: 7
  archive:
    needs: build-push
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Sauvegarder uniquement les preuves du run courant
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" -n lab5-acr-preuves -D evidence/partie2-acr
          mkdir -p evidence/archives
          zip -qr evidence/archives/lab5-acr-preuves.zip evidence/partie2-acr
          git config user.name "GemimaOndele"
          git config user.email "128593071+GemimaOndele@users.noreply.github.com"
          git add evidence/partie2-acr evidence/archives/lab5-acr-preuves.zip
          git diff --cached --quiet || git commit -m "Conserver les preuves ACR et OIDC du Lab 5"
          git pull --rebase origin main
          git push origin HEAD:main
