name: Lab5 - experiences sur AKS
on:
  push:
    branches: [main]
    paths: ['.github/workflows/aks-experiences.yml']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: lab5-aks
  cancel-in-progress: false
jobs:
  experiences:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: dc55bd12-6a90-49b4-a72d-10beb09e825a
          tenant-id: a2697119-66c5-4126-9991-b0a8d15d367f
          subscription-id: 5d564eeb-c928-4d01-9948-76ba3fc789d0
      - name: Initialiser le namespace du TP et ses deux pods
        run: |
          set -euo pipefail
          mkdir -p evidence/partie4-aks
          export KUBECONFIG="$RUNNER_TEMP/lab5-kubeconfig"
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"
          az aks get-credentials -g rg-lab5-go -n aks-lab5-go --file "$KUBECONFIG"
          kubectl config current-context
          kubectl get nodes -o wide | tee evidence/partie4-aks/nodes.txt
          az aks show -g rg-lab5-go -n aks-lab5-go --query '{name:name,location:location,provisioningState:provisioningState,powerState:powerState,sku:sku,nodeResourceGroup:nodeResourceGroup,kubernetesVersion:currentKubernetesVersion,pools:agentPoolProfiles[].{name:name,count:count,vmSize:vmSize,mode:mode,enableAutoScaling:enableAutoScaling}}' -o json > evidence/partie4-aks/cluster.json
          kubectl --context=aks-lab5-go apply -f k8s/namespace.yaml
          sed 's/ENVIRONMENT: "minikube"/ENVIRONMENT: "aks"/' k8s/configmap.yaml > "$RUNNER_TEMP/lab5-config.yaml"
          kubectl --context=aks-lab5-go -n iris apply -f "$RUNNER_TEMP/lab5-config.yaml"
          if ! kubectl --context=aks-lab5-go -n iris get secret iris-secret >/dev/null 2>&1; then
            kubectl --context=aks-lab5-go -n iris create secret generic iris-secret --from-literal=API_KEY="$(openssl rand -hex 16)"
          fi
          sed 's#image: iris-api:v1.*#image: acrlab5go4271.azurecr.io/iris-api:v1#' k8s/deployment.yaml > "$RUNNER_TEMP/lab5-deployment.yaml"
          kubectl --context=aks-lab5-go -n iris apply -f "$RUNNER_TEMP/lab5-deployment.yaml" -f k8s/service.yaml
          kubectl --context=aks-lab5-go -n iris rollout status deployment/iris-api --timeout=300s
          for i in $(seq 1 90); do
            IP=$(kubectl --context=aks-lab5-go -n iris get service iris-api -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            if [ -n "$IP" ] && curl -fsS --max-time 5 "http://$IP/" > evidence/partie4-aks/api-initiale.json; then break; fi
            sleep 4
          done
          test -s evidence/partie4-aks/api-initiale.json
          echo "$IP" > evidence/partie4-aks/adresse-publique.txt
          curl -fsS "http://$IP/ready" > evidence/partie4-aks/ready.json
          curl -fsS -H 'Content-Type: application/json' -d '{"features":[5.1,3.5,1.4,0.2]}' "http://$IP/predict" > evidence/partie4-aks/prediction.json
          kubectl --context=aks-lab5-go -n iris get pods -o wide > evidence/partie4-aks/pods-initial.txt
      - name: Executer rolling update, annulation, HPA et auto-reparation
        run: bash scripts/partie4-experiences-aks.sh
      - name: Conserver le diagnostic sans secret
        if: always()
        run: |
          mkdir -p evidence/partie4-aks
          kubectl --context=aks-lab5-go -n iris get pods,deploy,svc,hpa -o wide > evidence/partie4-aks/diagnostic-final.txt 2>&1 || true
          kubectl --context=aks-lab5-go -n iris get events --sort-by=.lastTimestamp > evidence/partie4-aks/events.txt 2>&1 || true
      - name: Archiver les preuves dans une copie Git propre
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence/archives
          zip -qr evidence/archives/lab5-aks-preuves.zip evidence/partie4-aks
          git config user.name "GemimaOndele"
          git config user.email "128593071+GemimaOndele@users.noreply.github.com"
          target=$(mktemp -d)
          git fetch origin main
          git worktree add --detach "$target" origin/main
          mkdir -p "$target/evidence/archives"
          cp -a evidence/partie4-aks "$target/evidence/"
          cp evidence/archives/lab5-aks-preuves.zip "$target/evidence/archives/"
          cd "$target"
          git add evidence/partie4-aks evidence/archives/lab5-aks-preuves.zip
          git diff --cached --quiet || git commit -m "Sauvegarder les resultats reels AKS du Lab 5"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lab5-aks-preuves
          path: evidence/partie4-aks/
          retention-days: 7
