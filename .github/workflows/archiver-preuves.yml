name: Lab5 - archiver les preuves
on:
  push:
    branches: [main]
    paths: ['.github/workflows/archiver-preuves.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Recuperer uniquement les preuves du run minikube termine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/archives
          gh api repos/GemimaOndele/Lab5-Docker-Kubernetes-Iris/actions/artifacts/13552366168/zip > evidence/archives/lab5-partie4-essai2.zip
          unzip -t evidence/archives/lab5-partie4-essai2.zip
          unzip -o evidence/archives/lab5-partie4-essai2.zip -d evidence/partie4-essai2/
          git config user.name "GemimaOndele"
          git config user.email "128593071+GemimaOndele@users.noreply.github.com"
          git add evidence/partie4-essai2 evidence/archives/lab5-partie4-essai2.zip
          git diff --cached --quiet || git commit -m "Sauvegarder les preuves reelles des experiences Kubernetes"
          git push origin HEAD:main
