name: Lab5 - rolling update et HPA sur minikube
on:
  push:
    branches: [main]
    paths: ['.github/workflows/partie4-minikube.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: lab5-partie4-minikube
  cancel-in-progress: false
jobs:
  experiences:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Conserver le premier essai et ses erreurs HTTP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/archives
          gh api repos/GemimaOndele/Lab5-Docker-Kubernetes-Iris/actions/artifacts/13551088685/zip > evidence/archives/lab5-partie4-premier-essai.zip
      - name: Installer minikube officiel avec verification SHA256
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/minikube https://github.com/kubernetes/minikube/releases/download/v1.39.0/minikube-linux-amd64
          curl -fsSLo /tmp/minikube.sha256 https://github.com/kubernetes/minikube/releases/download/v1.39.0/minikube-linux-amd64.sha256
          cd /tmp
          printf '%s  minikube\n' "$(cat minikube.sha256)" | sha256sum -c -
          sudo install minikube /usr/local/bin/minikube
      - name: Construire les versions v1 et v2
        run: |
          set -euo pipefail
          bash -n scripts/partie4-minikube-plan-b.sh
          docker build --build-arg APP_VERSION=1.0.0 -t iris-api:v1 .
          docker build --build-arg APP_VERSION=2.0.0 -t iris-api:v2 .
      - name: Deployer deux pods dans le profil dedie
        run: bash scripts/partie3-preparer.sh
      - name: Tester rolling update, image absente, annulation et HPA
        run: bash scripts/partie4-minikube-plan-b.sh
      - name: Collecter diagnostics et nettoyer le profil temporaire
        if: always()
        run: |
          mkdir -p evidence/partie4-minikube
          kubectl --context=lab5-go -n iris get pods,deploy,svc,hpa -o wide > evidence/partie4-minikube/diagnostic-final.txt 2>&1 || true
          kubectl --context=lab5-go -n iris get events --sort-by=.lastTimestamp > evidence/partie4-minikube/events.txt 2>&1 || true
          minikube -p lab5-go delete > evidence/partie4-minikube/nettoyage-minikube.txt 2>&1 || true
      - name: Sauvegarder les preuves dans le depot prive
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence/archives
          zip -qr evidence/archives/lab5-partie4-minikube.zip evidence/partie4-minikube
          git config user.name "GemimaOndele"
          git config user.email "128593071+GemimaOndele@users.noreply.github.com"
          target=$(mktemp -d)
          git fetch origin main
          git worktree add --detach "$target" origin/main
          mkdir -p "$target/evidence/archives"
          cp -a evidence/partie4-minikube "$target/evidence/"
          cp evidence/archives/lab5-partie4*.zip "$target/evidence/archives/"
          cd "$target"
          git add evidence/partie4-minikube evidence/archives/
          git diff --cached --quiet || git commit -m "Archiver les resultats verifies et le nettoyage minikube"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lab5-partie4-minikube
          path: evidence/partie4-minikube/
          retention-days: 7
